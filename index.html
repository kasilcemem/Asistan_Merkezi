<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ASİSTAN MERKEZİ | Kontrol Paneli</title>
    <style>
        body { background: #111; color: #eee; font-family: sans-serif; text-align: center; padding: 50px; }
        .dashboard { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .box { 
            border: 2px solid #444; padding: 20px; border-radius: 15px; width: 200px;
            transition: 0.3s; cursor: pointer; background: #222;
        }
        .box:hover { border-color: #00ff00; background: #333; }
        h1 { color: #00ff00; letter-spacing: 2px; }
        .status { color: #888; font-size: 0.8em; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>ASİSTAN MERKEZİ GİRİŞ</h1>
    <p>Workflow Aktif | Kaş İstasyonu</p>

    <div class="dashboard">
        <div class="box">
            <h3>🏗️ Mimari</h3>
            <p>Projeler ve Çizimler</p>
        </div>
        <div class="box">
            <h3>🌳 Bonsai</h3>
            <p>Bakım ve Sanat Notları</p>
        </div>
        <div class="box">
            <h3>📻 Radyo</h3>
            <p>Dünya Frekansları</p>
        </div>
    </div>
    
    <div class="status">Asistan sistemi GitHub üzerinde 7/24 çalışıyor.</div>
</body>
</html>
