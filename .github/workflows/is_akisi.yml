name: Asistan Dosya Duzenliyor
on: [push]

jobs:
  duzenleme-gorevi:
    runs-on: ubuntu-latest
    steps:
      - name: Dosyalara Erisim Sagla
        uses: actions/checkout@v4

      - name: Python Kur ve Asistanı Uyandır
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Akilli Ayiklamayi Calistir
        run: python src/asistan.py
