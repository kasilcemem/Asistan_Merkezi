name: Akilli Asistan Calisiyor
on: [push]

permissions:
  contents: write # Asistanın dosyaları değiştirme izni

jobs:
  asistan_is_basinda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Python Hazırla
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Klasörleri ve Raporu Düzenle
        run: python src/asistan.py

      - name: Degisiklikleri Kaydet
        run: |
          git config --global user.name "AsistanBot"
          git config --global user.email "asistan@bot.com"
          git add .
          git commit -m "Asistan: Dosyalar düzenlendi ve rapor güncellendi" || echo "Degisiklik yok"
          git push
